# Blueprint do Render (opcional): New > Blueprint e aponte para este repositorio.
# Tambem da para criar manualmente: New > Web Service > Docker, Root Directory = backend-java.
services:
  - type: web
    name: alertacidade-api
    runtime: docker
    plan: free
    rootDir: backend-java
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/pontos
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
